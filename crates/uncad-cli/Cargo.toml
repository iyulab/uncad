[package]
name = "uncad-cli"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "CLI for uncad (CAD file summary, JSON export of the parsed model, SVG/PNG rendering)."
keywords = ["cad", "dwg", "dxf", "cli", "svg"]
categories = ["command-line-utilities", "graphics"]

[lints]
workspace = true

[[bin]]
name = "uncad"
path = "src/main.rs"

[dependencies]
uncad = { path = "../uncad", version = "0.2.0" }
# SVG/PNG output. A version dependency, never a path.
iron-render-cad = "0.1.0"
# The LLM/VLM package behind `uncad export`. A version dependency, never
# a path: the crate reads no files and knows no parser, so this CLI hands
# it the parsed drawing and its header.
iron-pack-cad = "0.1.0"
# Carries the header from uncad's type to iron-pack-cad's (see main.rs).
serde_json = "1.0.151"
