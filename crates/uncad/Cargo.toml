[package]
name = "uncad"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "CAD file (DWG/DXF) parsing with JSON, SVG and PNG export of the parsed model, built on libredwg-sys."
keywords = ["cad", "dwg", "dxf", "svg", "json"]
categories = ["graphics", "parser-implementations"]

[lints]
workspace = true

[dependencies]
libredwg-sys = { path = "../libredwg-sys", version = "0.2.0" }
# The entity model this crate fills. A version dependency, never a path:
# this crate must build from a standalone checkout.
uncad-model = "0.1.0"
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The tests that check what a parsed drawing *draws* (an empty block reported,
# unsupported types listed in order, byte-identical output) render it through
# the renderer crate. A version dependency, never a path.
iron-render-cad = "0.1.0"
# A second, independent DWG reader, used by tests only -- it is how this
# crate's own output gets an oracle that does not share its engine. A
# *development* dependency on purpose: nothing a consumer builds or links
# reaches it, and the crate's public surface does not change. Consumed
# unmodified; a fork or a patch would be a different decision.
#
# Weak (file-scope) copyleft, so it is allowed by name in `deny.toml` rather
# than folded into the permissive list, and it is named in
# `docs/THIRD_PARTY_NOTICES.md` with where its source can be obtained.
acadrust = "0.5.5"
