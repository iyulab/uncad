[package]
name = "uncad"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "CAD file (DWG/DXF) parsing with JSON, SVG and PNG export of the parsed model, built on libredwg-sys."
keywords = ["cad", "dwg", "dxf", "svg", "json"]
categories = ["graphics", "parser-implementations"]

[lints]
workspace = true

[dependencies]
libredwg-sys = { path = "../libredwg-sys", version = "0.1.0" }
libc = "0.2"
regex = "1"
resvg = "0.48"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
