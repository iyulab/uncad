name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Point bindgen at the preinstalled LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # A declared rust-version nobody checks goes stale with the next dependency
  # bump. This job builds with exactly the declared toolchain, so the
  # declaration and the truth cannot drift apart silently.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      # No submodules: `cargo check` runs no tests, and the build compiles the
      # vendored LibreDWG copy.
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Read the declared rust-version
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv" || { echo "no rust-version in Cargo.toml"; exit 1; }
          echo "MSRV=$msrv" >> "$GITHUB_ENV"

      - name: Install that toolchain
        run: rustup toolchain install "$MSRV" --profile minimal

      - name: Check the workspace with it
        run: cargo +"$MSRV" check --workspace --all-features --all-targets --locked

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      # No submodules: the audit reads Cargo.lock, and the vendored C library
      # is not part of the Rust dependency graph.
      - uses: actions/checkout@v7

      # Prebuilt binary -- avoids compiling cargo-audit on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  licenses:
    name: License Gate
    runs-on: ubuntu-latest
    steps:
      # No submodules, for the same reason as the audit job above: this reads
      # Cargo.lock, and the vendored C library is not a Rust dependency. See
      # deny.toml for what that leaves uncovered.
      - uses: actions/checkout@v7

      # Prebuilt binary -- avoids compiling cargo-deny on every run.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # This crate is GPL because it links a GPL library, and that is declared.
      # The gate exists so a *second* copyleft component cannot arrive through
      # a dependency bump without anyone noticing.
      - name: Check dependency licenses
        run: cargo deny check licenses sources

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Rustfmt check
        run: cargo fmt --check

      # libredwg-sys's bindgen-generated bindings.rs carries a few harmless
      # lints of its own (useless_transmute, missing_safety_doc) --
      # allow()'d at the crate level in crates/libredwg-sys/src/lib.rs
      # rather than suppressed here, so `-D warnings` below still catches
      # anything new in code this project actually controls.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
