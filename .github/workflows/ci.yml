name: CI

# Every push, not just main: docs/CAVEATS.md promises that "whether the tree
# is clean is tracked automatically", and a release branch that sits dozens of
# commits ahead of main with no PR open is exactly where a Linux-only bindgen
# or formatting regression hides. The concurrency group below keeps the extra
# trigger cheap -- a branch's push run is superseded as soon as its PR run (or
# the next push) starts.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang (bindgen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Point bindgen at the preinstalled LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      # No submodules: the audit reads Cargo.lock, and the vendored C library
      # is not part of the Rust dependency graph.
      - uses: actions/checkout@v4

      # Prebuilt binary -- avoids compiling cargo-audit on every run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2

      - name: Install libclang (bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Rustfmt check
        run: cargo fmt --check

      # libredwg-sys's bindgen-generated bindings.rs carries a few harmless
      # lints of its own (useless_transmute, missing_safety_doc) --
      # allow()'d at the crate level in crates/libredwg-sys/src/lib.rs
      # rather than suppressed here, so `-D warnings` below still catches
      # anything new in code this project actually controls.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
