# cargo-deny -- license gate for the Rust dependency graph.
#
# What this guards: this workspace links a GPL-3.0-or-later C library, so its
# own crates are GPL. That is deliberate and declared. What must NOT happen is
# a *second* copyleft component arriving unnoticed through a Rust dependency,
# because the whole point of keeping the copyleft boundary at one repository is
# that it stays knowable. Until this file existed, "the only copyleft here is
# the vendored C library" was true but checked by hand.
#
# Scope note: like the cargo-audit job beside it, this reads Cargo.lock, so the
# vendored C sources are not in view -- they are not part of the Rust
# dependency graph. The drift detector in crates/libredwg-sys/build.rs is what
# watches that side.
#
# Run locally: cargo deny check licenses

[graph]
# Development dependencies are part of this repository's dependency graph even
# though nothing distributed contains them, and this file exists so that graph
# stays knowable -- not only the distributed part of it. This widens the graph
# the `sources` and `bans` checks below walk, so a test-only dependency from an
# unknown registry or a git URL is caught like any other.
#
# This setting alone does not bring them into the license check: that check
# has its own switch, `include-dev` under `[licenses]`, which defaults to
# false. Both are set.
exclude-dev = false

[licenses]
# Development dependencies are licence-checked too. Nothing distributed
# contains them, but the obligations some licenses carry reach whoever
# distributes a built form of the tests, and a test-only dependency is still
# a dependency this repository chose.
include-dev = true
# Permissive only. Every entry below was observed in the current graph; this is
# not a speculative allowlist.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "0BSD",
    "Unicode-3.0",
]
# Deliberately absent: MPL-2.0, EPL, CDDL and the LGPLs. They are weak
# copyleft, not permissive, and admitting one here would quietly undo the
# boundary this file exists to hold. Adding one is a decision to be argued,
# not a line to be appended when a build fails.
#
# MPL-2.0 in particular stays out of this list even though one *development*
# dependency now carries it. Its copyleft reaches only the files it already
# covers, and it explicitly permits distributing a larger work under other
# terms -- but even an unmodified copy obliges whoever distributes a built
# form to say where that dependency's source can be obtained. That is one
# obligation more than permissive, so it would be granted per crate rather
# than to every crate that might carry the license later: see `exceptions`
# below.

# Copyleft is granted per crate, never by license name. The GPL lives on the
# three crates this workspace publishes and nowhere else -- a fourth crate
# named here means the boundary moved, which is a decision, not a dependency
# bump.
exceptions = [
    { crate = "libredwg-sys", allow = ["GPL-3.0-or-later"] },
    { crate = "uncad", allow = ["GPL-3.0-or-later"] },
    { crate = "uncad-cli", allow = ["GPL-3.0-or-later"] },
    # Not copyleft, but not code either: iron-pack-cad bundles a font (a
    # Noto Sans KR subset) under the SIL Open Font License, so its expression
    # is `MIT AND OFL-1.1`. cargo-deny sees only that expression, never the
    # font file, so the OFL is granted here for this crate alone and named in
    # `docs/THIRD_PARTY_NOTICES.md`; a font arriving through any other crate
    # is still refused.
    { crate = "iron-pack-cad", allow = ["MIT", "OFL-1.1"] },
    # Weak, file-scope copyleft, consumed unmodified and only by this
    # workspace's tests; where its source can be obtained is recorded in
    # `docs/THIRD_PARTY_NOTICES.md`. Granted to this crate by name: a second
    # MPL crate arriving later must be argued on its own, which is the whole
    # reason the license is not in the `allow` list above.
    { crate = "acadrust", allow = ["MPL-2.0"] },
]

[bans]
# A second copy of a crate is a build-size and correctness smell, but not a
# license question -- warn, do not fail the gate this file exists for.
multiple-versions = "warn"

[advisories]
# cargo-audit already runs as its own job; this section stays at defaults so
# the two do not disagree about the same database.

[sources]
# crates.io only. A git or alternate-registry dependency would bypass the
# license review above, since its license field is whatever the source says.
unknown-registry = "deny"
unknown-git = "deny"
